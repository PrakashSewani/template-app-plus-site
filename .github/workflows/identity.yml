name: identity

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  identity:
    # The template repository itself ships the placeholders on purpose — it is exempt.
    # Every repository created from it is not.
    if: ${{ !startsWith(github.event.repository.name, 'template-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/check-identity.mjs
